name: Publish core

# CD for the public npm package @albertomarturelo/nemo-core, triggered by a
# `core-v*` git tag (ADR-014, tag scheme amended by ADR-015). Only
# `packages/core` is published here — the CLI has its own `cli-v*` workflow and
# the two version independently, so this is not a lockstep release. `NPM_TOKEN`
# lives in the `npm-publish` GitHub Environment whose deployment tag policy must
# list both prefixes — a run triggered from any other ref cannot read it.
# `pnpm publish` is idempotent — an already-published version is skipped, not an
# error. The pre-ADR-015 `v0.1.0` tag stays as historical record.

on:
  push:
    tags:
      - 'core-v*'

permissions:
  contents: read

jobs:
  publish:
    name: Build + publish (core)
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — action-setup reads pnpm from package.json
      # `packageManager` (the single source of truth), matching ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@albertomarturelo'

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      - name: Typecheck + build (tsc -b)
        run: pnpm build

      - name: Verify tag matches packages/core version (ADR-014)
        # Guard against a mismatched tag publishing a stale version.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#core-v}"
          version=$(node -p "require('./packages/core/package.json').version")
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match packages/core version '${version}'. Bump packages/core/package.json or retag."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches packages/core."

      - name: Publish @albertomarturelo/nemo-core (idempotent — skips an already-published version)
        run: pnpm --filter @albertomarturelo/nemo-core publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
